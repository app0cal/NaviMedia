[project]
name = "navidrome-media-dl"
version = "0.1.0"
description = "Queue-based YouTube and Spotify downloader for a Navidrome music folder."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
media-dl = "media_dl.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
